# Penguin Harness (penguinh) Web UI - 一键启动
# 镜像由 GitHub Actions 构建并推送到 GHCR, 这里直接拉取
services:
  penguinh:
    image: ghcr.io/kevinlidk/penguinh-docker:latest
    pull_policy: always        # 每次 up 都拉取最新镜像
    container_name: penguinh-web
    restart: unless-stopped
    init: true                 # 内置 tini/init 作为 PID 1, 妥善回收子进程与信号管理
    ports:
      - "7364:7364"            # 宿主机端口:容器端口, 改左边可换端口 (如 "8080:7364")
    volumes:
      - ./data:/home/penguin/.penguin/data  # Penguin 配置/凭据/模型会话数据 (持久化)
      - ./workspace:/home/penguin/workspace # 你的项目目录 (Agent 工作区)
      # - ./projects:/home/penguin/workspace/extra # 可选: 额外挂载更多目录
    environment:
      - NODE_ENV=production
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
